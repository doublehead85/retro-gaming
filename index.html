<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meine Retro-Konsole</title><style>body{font:16px system-ui;background:#111827;color:#f9fafb;margin:0;padding:24px}main{max-width:900px;margin:auto}select,button{font:inherit;padding:12px;border-radius:8px;margin:6px;background:#374151;color:white;border:1px solid #6b7280}button{cursor:pointer}#game{width:100%;height:min(70vh,650px);background:black;margin-top:18px}.note{color:#cbd5e1}</style></head><body><main><h1>🎮 Meine Retro-Konsole</h1><p class="note">Wähle ein Spiel aus. Die Dateien werden online geladen.</p><select id="selection" aria-label="Spiel auswählen"></select><button id="start">Spielen</button><p id="status" role="status"></p><div id="game"></div></main><script src="games.js"></script><script>const select=document.getElementById('selection'),status=document.getElementById('status');for(const [i,g] of GAMES.entries()){const option=document.createElement('option');option.value=i;option.textContent=g.title+' ('+g.system+')';select.append(option)}document.getElementById('start').onclick=()=>{const g=GAMES[Number(select.value)];if(!g){status.textContent='Noch keine Spiele eingetragen.';return}if(!g.url){status.textContent='Für dieses Spiel fehlt noch eine ROM-Datei.';return}const params=new URLSearchParams({core:g.core,game:g.url});if(g.bios)params.set('bios',g.bios);location.href='player.html?'+params};if(!GAMES.length)status.textContent='Trage deine legal bereitstellbaren Spiele in games.js ein.';</script></body></html>
